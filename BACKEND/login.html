<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChurchFlow Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <h1>ChurchFlow</h1>
                <p>Church Management System</p>
            </div>

            <h2>Welcome Back</h2>

            <p class="login-subtitle">
                Sign in to continue
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="togglePassword">
                            Show
                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe">

                        <span>Remember me</span>

                    </label>

                </div>


                <div
                    id="loginMessage"
                    class="login-message">
                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>

            </form>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
