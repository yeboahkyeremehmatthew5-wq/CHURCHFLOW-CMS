<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ChurchFlow CMS - Sign Up</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head><body><div class="login-container">

    <div class="login-card">

        <h1>ChurchFlow CMS</h1>

        <p class="login-subtitle">
            Create Your Account
        </p>

        <form id="signupForm">

            <div class="form-group">

                <label for="signupUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="signupUsername"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Sign Up
            </button>


            <p
                id="signupMessage"
                class="login-message"
            ></p>

        </form>


        <div class="signup-link">

            <span>
                Already have an account?
            </span>

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<script src="signup.js"></script>

</body></html>
